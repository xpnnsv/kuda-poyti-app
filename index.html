<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4059">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Куда пойти</title>
  <!--
    Загрузчик. Этот файл НЕ МЕНЯЕТСЯ между версиями — пусть Telegram хранит его в кэше сколько угодно.
    При каждом запуске он в обход кэша узнаёт номер последней версии (version.json)
    и открывает app.html с этим номером, поэтому Telegram всегда скачивает свежее приложение.
    Хэш (#tgWebAppData=...) и параметры Telegram передаются дальше без изменений.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(165deg, #ff7a8c 0%, #ff4059 55%, #e8304a 100%); }
  </style>
  <script>
    (function () {
      function go(v) {
        var params = new URLSearchParams(location.search);
        params.set('v', v);
        location.replace('app.html?' + params.toString() + location.hash);
      }
      var done = false;
      var fallback = setTimeout(function () { if (!done) { done = true; go(String(Date.now())); } }, 4000);
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (data) { if (!done) { done = true; clearTimeout(fallback); go(data.v); } })
        .catch(function () { if (!done) { done = true; clearTimeout(fallback); go(String(Date.now())); } });
    })();
  </script>
</head>
<body></body>
</html>
